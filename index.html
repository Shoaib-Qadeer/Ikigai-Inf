<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Inferred Ikigai Prototype</title>
<meta name="description" content="Prototype: three short games and a self-report check that build an explainable interests and personality profile for graduating students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one 760px column, a waypoint route bar on top; screens swap in place like pages of a field journal. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E6EDE9; --ink:#14302B; --muted:#536C66; --line:#C9D5D0;
  --accent:#17705F; --accent-ink:#FFFFFF; --accent-soft:#D5EAE4; --sun:#B9800C;
  --good:#2C7A4B; --mixed:#9C6508; --conflict:#A8443A;
  --t-r:#8A5A2B; --t-i:#2C5F9E; --t-a:#94397F; --t-s:#2C7A4B; --t-e:#A8443A; --t-c:#585D6E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1816; --surface:#16231F; --surface-2:#1E2F2A; --ink:#E4EDE9; --muted:#97ADA6; --line:#2E423C;
  --accent:#4DB59E; --accent-ink:#06201A; --accent-soft:#1D3B34; --sun:#E2B451;
  --good:#5CB884; --mixed:#E0A644; --conflict:#E27A6E;
  --t-r:#D09A62; --t-i:#7FA9E3; --t-a:#D982C5; --t-s:#5CB884; --t-e:#E27A6E; --t-c:#A7ABBA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1816; --surface:#16231F; --surface-2:#1E2F2A; --ink:#E4EDE9; --muted:#97ADA6; --line:#2E423C;
  --accent:#4DB59E; --accent-ink:#06201A; --accent-soft:#1D3B34; --sun:#E2B451;
  --good:#5CB884; --mixed:#E0A644; --conflict:#E27A6E;
  --t-r:#D09A62; --t-i:#7FA9E3; --t-a:#D982C5; --t-s:#5CB884; --t-e:#E27A6E; --t-c:#A7ABBA; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.3rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--accent)}
.route{display:flex;align-items:center;gap:0;flex:1;min-width:0;justify-content:center}
.wp{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.wp i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:block;flex:none}
.wp.done i{background:var(--accent);border-color:var(--accent)}
.wp.now i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wp.now{color:var(--ink)}
.seg{width:18px;height:2px;background:var(--line);margin:0 4px;flex:none}
.seg.done{background:var(--accent)}
@media (max-width:620px){ .wp b{display:none} .seg{width:10px} }
@media (max-width:480px){ .route{display:none} }
.deck-stack{z-index:2}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .82rem var(--body);cursor:pointer;white-space:nowrap}
.iconbtn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.iconbtn.on .dot{background:var(--accent)}

main{padding-top:28px}
.screen{display:flex;flex-direction:column;gap:22px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;border-radius:999px;padding:11px 22px;font:700 1rem var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:7px 14px;font-size:.88rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.note{background:var(--surface-2);border-radius:var(--radius);padding:14px 16px;font-size:.95rem}
.hr{height:1px;background:var(--line)}

/* welcome */
.hero{display:grid;gap:18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.legs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.legs{grid-template-columns:1fr}}
.leg{border-top:3px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.leg .eyebrow{color:var(--accent)}

/* forms */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],input[type=password],select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:44px;height:44px;resize:vertical;font-size:.92rem}
textarea:focus{height:80px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--accent)}

/* Game A */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-width:0}
.ticket p{font-weight:600;font-size:1.02rem}
.ticket.most{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.ticket.least{border-color:var(--conflict);box-shadow:inset 0 0 0 1px var(--conflict)}
.pickrow{display:flex;gap:8px}
.pick{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 0;font:600 .88rem var(--body);cursor:pointer}
.pick.on.m{background:var(--good);border-color:var(--good);color:var(--surface)}
.pick.on.l{background:var(--conflict);border-color:var(--conflict);color:var(--surface)}

/* progress line */
.prog{display:flex;align-items:center;gap:12px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}

/* Game B */
.scene{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:16px}
.scene .quote{font-size:1.15rem}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--radius);padding:12px 14px;font:400 1rem var(--body);cursor:pointer}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px;flex:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}

/* Game C */
.lock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:48px;height:56px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:600 1.6rem var(--mono)}
.timer{font:600 1rem var(--mono)}
.guessrow{display:flex;gap:8px;width:100%;max-width:420px}
.guessrow input{text-transform:uppercase;font-family:var(--mono);letter-spacing:.2em;text-align:center}
.fb{min-height:1.5em;font-weight:600}
.fb.bad{color:var(--conflict)} .fb.good{color:var(--good)}

/* self-report */
.q{padding-block:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.q:last-child{border-bottom:0}
.q .stem{font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:620px){.scale{grid-template-columns:1fr}}
.scale label{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:.86rem;cursor:pointer;background:var(--bg);line-height:1.25;display:flex;align-items:center;justify-content:center;gap:6px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale label:has(input:focus-visible){outline:3px solid var(--sun);outline-offset:1px}
.practice{border:1px dashed var(--accent);border-radius:var(--radius);padding:16px;background:var(--surface)}

/* results */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:700 .95rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.code{display:flex;gap:8px;flex-wrap:wrap}
.letter{width:64px;height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--surface);font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.letter small{font:600 .62rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.92rem}
@media (max-width:520px){.barrow{grid-template-columns:96px minmax(0,1fr) 78px}}
.barrow .lbl{font-weight:600;overflow-wrap:anywhere}
.btrack{position:relative;height:14px;background:var(--surface-2);border-radius:7px}
.btrack .g{position:absolute;top:0;bottom:0;left:0;border-radius:7px;opacity:.9}
.btrack .s{position:absolute;top:-3px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:10px;border-radius:5px;display:inline-block;background:var(--accent)}
.sw.tick{width:3px;height:14px;background:var(--ink);border-radius:2px}
.stmt{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.stmt .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pill{font:600 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.consistent{color:var(--good)} .pill.mixed{color:var(--mixed)} .pill.conflicting{color:var(--conflict)} .pill.example{color:var(--sun)}
.stmt .text{font-size:1.1rem;font-weight:600}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 .85rem var(--body);cursor:pointer}
.react button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.fields ul{margin:6px 0 0;padding-left:20px}
.banner{border:1px solid var(--sun);color:var(--ink);background:var(--surface);border-radius:var(--radius);padding:10px 14px;font-size:.92rem}
.banner b{color:var(--sun)}

/* evidence */
.ev{display:flex;flex-direction:column;gap:12px}
.ev details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.ev summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ev .calc{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:10px 0 0;font-size:.92rem}
.ev dt{color:var(--muted);font-weight:600}
.ev dd{margin:0;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tt{font:600 .7rem var(--mono);border-radius:4px;padding:1px 5px;color:var(--surface)}
.jsonbox{font:400 .75rem/1.4 var(--mono);max-height:260px;overflow:auto;white-space:pre;background:var(--surface-2);border-radius:8px;padding:10px}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb, var(--ink) 40%, transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal .panel{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:13px;cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}

/* AI coach */
.coach{border:1px solid var(--accent);border-radius:var(--radius);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 12px;border-radius:8px;font-size:.95rem;white-space:pre-wrap}
.msg.ai{background:var(--accent-soft)}
.msg.me{background:var(--surface-2)}
.msg .who{font:600 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
/* pictures */
.ico{display:block;flex:none}
.art{width:58px;height:58px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.scene-art{width:76px;height:76px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* Game C tiles */
.padlock{width:72px;height:72px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s}
.padlock.open{background:var(--accent-soft);color:var(--good)}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:44px;height:52px;border-bottom:3px solid var(--line);display:grid;place-items:center;font:600 1.5rem var(--mono)}
.slot.full{border-bottom-color:var(--accent)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
button.tile{color:var(--ink);cursor:pointer;transition:transform .08s}
button.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
button.tile:disabled{opacity:.25;cursor:default}
.iconbtn{display:inline-flex;align-items:center;gap:6px}

/* Mirror round: deck */
.deck-area{display:flex;flex-direction:column;gap:22px;align-items:center}
.deck-stack{position:relative;width:min(100%,400px);min-height:210px}
.deck-shadow{position:absolute;inset:10px -8px -10px 8px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);transform:rotate(2.5deg)}
.deck-card{position:relative;min-height:210px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px color-mix(in srgb, var(--ink) 12%, transparent);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:grab;touch-action:none;user-select:none}
.deck-card.dragging{z-index:10;cursor:grabbing;box-shadow:0 16px 36px color-mix(in srgb, var(--ink) 22%, transparent)}
.deck-card.practice{border:2px dashed var(--accent)}
.deck-text{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.2;text-wrap:balance}
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
.zone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);color:var(--ink);cursor:pointer;font:400 .9rem var(--body);line-height:1.2;text-align:center;transition:transform .1s, box-shadow .1s}
.zone b{font-weight:700}
.zone .za{font:400 .66rem var(--mono);color:var(--muted);letter-spacing:.02em}
.zone .zf{color:var(--accent)}
.z1{background:var(--surface)} .z2{background:color-mix(in srgb, var(--accent) 8%, var(--surface))} .z3{background:color-mix(in srgb, var(--accent) 15%, var(--surface))}
.z4{background:color-mix(in srgb, var(--accent) 24%, var(--surface))} .z5{background:color-mix(in srgb, var(--accent) 34%, var(--surface))}
.zone:hover,.zone.hot{transform:translateY(-3px);box-shadow:0 0 0 2px var(--accent)}
.zone.on{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:560px){ .zone{padding:10px 2px;font-size:.78rem} .zone .za{display:none} .deck-text{font-size:1.35rem} }

/* Mirror round: job board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.board{grid-template-columns:1fr}}
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.job.rated{border-color:var(--accent)}
.job.practice{border-style:dashed;border-color:var(--accent)}
.job p{font-weight:600;flex:1}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.job .art{width:46px;height:46px}
.faces{display:flex;justify-content:space-between;gap:2px}
.facebtn{background:none;border:0;padding:4px;border-radius:50%;color:var(--muted);cursor:pointer;transition:transform .1s,color .1s}
.facebtn:hover{color:var(--ink);transform:scale(1.12)}
.facebtn.on{color:var(--accent-ink);background:var(--accent);transform:scale(1.15)}
.facelab{min-height:1.2em;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Inferred <span>Ikigai</span></div>
    <nav class="route" id="route" aria-label="Progress"></nav>
    <button class="iconbtn" id="aiBtn" type="button"><span class="dot"></span>AI mode</button>
  </div>
</header>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<div id="modalRoot"></div>

const MINI_IPIP = [ // Donnellan et al. (2006), items and keys from ipip.ori.org/MiniIPIPKey.htm; original item order

const ZONES = [ // value, standard IPIP anchor, friendly label
 [1,"Very inaccurate","That's not me"],[2,"Moderately inaccurate","Not really"],[3,"Neither","Hard to say"],[4,"Moderately accurate","Kind of me"],[5,"Very accurate","That's me"]];

const SENTENCES = {

  A:{high:"You tend to put other people's feelings first and avoid conflict.",middle:"You balance caring for others with standing up for yourself.",low:"You tend to be direct, and put fairness or the task ahead of keeping the peace."},

/* ---------- scoring (pure functions) ---------- */
const round0 = x => Math.round(x);
const r2 = x => Math.round(x*100)/100;
function band(score){ return score <= 33 ? "low" : score <= 66 ? "middle" : "high"; }
const BAND_LABEL = {low:"lower", middle:"middle", high:"higher"};
function gapLabel(gap){ return gap <= 20 ? "consistent" : gap <= 35 ? "mixed" : "conflicting"; }
function overlapLabel(n){ return n >= 2 ? "consistent" : n === 1 ? "mixed" : "conflicting"; }

function hollandCode(scores, mostCounts){
  const order = TYPES.slice().sort((a,b) => (scores[b]-scores[a]) || ((mostCounts?mostCounts[b]:0)-(mostCounts?mostCounts[a]:0)) || (TYPES.indexOf(a)-TYPES.indexOf(b)));
  return order.slice(0,3).join("");
}
function scoreGameA(picks){ // picks: [{round, most:type, least:type}]
  const most={}, least={}, net={}, score={}, calc={};
  TYPES.forEach(t => { most[t]=0; least[t]=0; });
  picks.forEach(p => { most[p.most]++; least[p.least]++; });
  TYPES.forEach(t => { net[t]=most[t]-least[t]; score[t]=round0((net[t]+6)/12*100);
    calc[t]=`net = ${most[t]} most − ${least[t]} least = ${net[t]}\nscore = (${net[t]} + 6) ÷ 12 × 100 = ${score[t]}`; });
  return { most, least, net, score, calc, code: hollandCode(score, most) };
}
function scoreInterestSR(answers){ // answers: {I1: 1..5}
  const score={}, calc={}, vals={};
  TYPES.forEach(t => {
    const items = INTEREST_ITEMS.filter(i => i.type===t);
    vals[t] = items.map(i => answers[i.id]);
    const mean = vals[t].reduce((a,b)=>a+b,0)/items.length;
    score[t] = round0((mean-1)/4*100);
    calc[t] = `answers ${vals[t].join(", ")} → mean ${r2(mean)}\nscore = (${r2(mean)} − 1) ÷ 4 × 100 = ${score[t]}`;
  });
  return { score, calc, vals, code: hollandCode(score, null) };
}
function scoreGameB(levels){ // levels: {E1: 1..4, ...}
  const out={};
  TRAITS.forEach(tr => {
    const sc = B_SCENES.filter(s => s.trait===tr);
    const lv = sc.map(s => levels[s.id]);
    const mean = lv.reduce((a,b)=>a+b,0)/lv.length;
    const score = round0((mean-1)/3*100);
    out[tr] = { levels: lv, scenes: sc.map(s=>s.id), mean, score,
      calc: `levels ${lv.join(", ")} → mean ${r2(mean)}\nscore = (${r2(mean)} − 1) ÷ 3 × 100 = ${score}` };
  });
  return out;
}
function scoreLikert(items, answers){ // returns score, calc
  const raw = items.map(i => answers[i.id]);
  const keyed = items.map((i,k) => i.key===1 ? raw[k] : 6-raw[k]);
  const mean = keyed.reduce((a,b)=>a+b,0)/keyed.length;
  const score = round0((mean-1)/4*100);
  const parts = items.map((i,k) => i.key===1 ? `${raw[k]}` : `${raw[k]}→${keyed[k]}`);
  return { raw, keyed, mean, score, calc:`answers (− items reversed 6 − x): ${parts.join(", ")} → mean ${r2(mean)}\nscore = (${r2(mean)} − 1) ÷ 4 × 100 = ${score}` };
}
function scoreMiniIPIP(answers){
  const out={};
  TRAITS.forEach(tr => { out[tr] = scoreLikert(MINI_IPIP.filter(i=>i.trait===tr), answers); });
  return out;
}
function scoreGameC(results){ // results: [{n, seconds, guesses, outcome}]
  const rows = results.map(r => {
    const lock = C_LOCKS.find(l => l.n===r.n);
    const active = lock.solvable ? null : Math.min(r.seconds, r.guesses*C_SEC_PER_GUESS);
    const flag = !lock.solvable && r.seconds > 30 && active < r.seconds/2;
    return { ...r, solvable: lock.solvable, active, flag };
  });
  const uns = rows.filter(r => !r.solvable);
  const meanActive = uns.reduce((a,r)=>a+r.active,0)/uns.length;
  const meanRaw = uns.reduce((a,r)=>a+r.seconds,0)/uns.length;
  const score = round0(Math.min(1, meanActive/C_LIMIT)*100);
  const solved = rows.filter(r => r.solvable && r.outcome==="solved").length;
  const lines = uns.map(r => `lock ${r.n}: min(${r1(r.seconds)} s, ${r.guesses} guesses × ${C_SEC_PER_GUESS} s) = ${r1(r.active)} s${r.flag?"  [flag: waiting, not trying]":""}`);
  return { rows, meanActive, meanRaw, score, solved, flags: uns.filter(r=>r.flag).length,
    calc: lines.join("\n") + `\nmean active = ${r1(meanActive)} s\nscore = ${r1(meanActive)} ÷ ${C_LIMIT} × 100 = ${score}` };
}
function r1(x){ return Math.round(x*10)/10; }

function compareScores(game, self){
  const gap = Math.abs(game-self), avg = round0((game+self)/2);
  return { gap, avg, label: gapLabel(gap), band: band(avg) };
}

function buildProfile(data){ // data: {A:{picks}, B:{levels}, C:{results}, SR:{answers}}
  const gA = scoreGameA(data.A.picks);
  const sI = scoreInterestSR(data.SR.answers);
  const shared = gA.code.split("").filter(l => sI.code.includes(l));
  const combined = {}; TYPES.forEach(t => combined[t] = round0((gA.score[t]+sI.score[t])/2));
  const combinedCode = hollandCode(combined, gA.most);
  const interest = { game:gA, self:sI, shared, label: overlapLabel(shared.length), combined, combinedCode,
    rule:`game code ${gA.code}, self-report code ${sI.code}; shared letters: ${shared.length ? shared.join(", ") : "none"} (${shared.length}) → ${overlapLabel(shared.length)}\ncombined score per type = (game + self-report) ÷ 2; combined code ${combinedCode}` };

  const gB = scoreGameB(data.B.levels);
  const sM = scoreMiniIPIP(data.SR.answers);
  const traits = {};
  TRAITS.forEach(tr => {
    const c = compareScores(gB[tr].score, sM[tr].score);
    traits[tr] = { game:gB[tr], self:sM[tr], ...c, sentence: SENTENCES[tr][c.band],
      rule:`gap = |${gB[tr].score} − ${sM[tr].score}| = ${c.gap} → ${c.label} (≤20 consistent, 21–35 mixed, >35 conflicting)\naverage = (${gB[tr].score} + ${sM[tr].score}) ÷ 2 = ${c.avg} → ${BAND_LABEL[c.band]} band → sentence ${tr}-${c.band}` };
  });

  const gC = scoreGameC(data.C.results);
  const sP = scoreLikert(PERSIST_ITEMS, data.SR.answers);
  const pc = compareScores(gC.score, sP.score);
  const persistence = { game:gC, self:sP, ...pc, sentence: SENTENCES.P[pc.band],
    rule:`gap = |${gC.score} − ${sP.score}| = ${pc.gap} → ${pc.label}\naverage = ${pc.avg} → ${BAND_LABEL[pc.band]} band → sentence P-${pc.band}` };

  return { version: VERSION, interest, traits, persistence };
}

/* Game C */
let timerId = null;
function clearTimer(){ if (timerId){ clearInterval(timerId); timerId=null; } }
SCREENS.C = () => {
  if (S.C.phase === "intro") return `
    <div class="stack-sm"><span class="eyebrow">Game C · Stubborn Lock</span><h2>Eight word locks</h2></div>
    <div class="panel stack">
      <p>Each lock opens with a six-letter English word that uses <b>all</b> the letters shown, once each. Tap the letters to build it.</p>

    </div>
    <div class="row"><button class="btn" data-act="cBegin">Start the first lock</button></div>`;
  const lock = C_LOCKS[S.C.i];
  return `
    <div class="stack-sm"><span class="eyebrow">Game C · Stubborn Lock</span><h2>Lock ${lock.n}</h2></div>
    ${progress(S.C.i, C_LOCKS.length, "Lock")}
    <div class="lock">
      <div class="padlock" id="cPad">${icon("lock", 40)}</div>

        <button class="iconbtn" data-act="cDel" type="button">${icon("delete",16)} Delete</button>

      </div>
      <div class="fb" id="cFb" role="status"></div>
      <div class="row small muted num" style="justify-content:center;gap:18px"><span class="timer" id="cTimer">90 s left</span><span id="cCount">Guesses: 0</span></div>
    </div>
    <p class="small muted" style="text-align:center">Tap letters or type them. A guess is tried when all six slots are filled.</p>
    <div class="row"><button class="btn ghost" data-act="cSkip">Skip this lock</button></div>`;
};
function lockUI(){
  const lock = C_LOCKS[S.C.i], cur = S.C.cur; if (!cur) return;
  const slots = $("#cSlots"), tiles = $("#cTiles"); if (!slots) return;
  slots.innerHTML = Array.from({length:6}, (_,k) => `<div class="slot ${cur.picked[k]!=null?"full":""}">${cur.picked[k]!=null ? lock.letters[cur.picked[k]] : ""}</div>`).join("");
  tiles.innerHTML = cur.order.map(ix => `<button class="tile" type="button" data-act="cTile" data-ix="${ix}" ${cur.picked.includes(ix)?"disabled":""} aria-label="Letter ${lock.letters[ix]}">${lock.letters[ix]}</button>`).join("");
  $("#cCount").textContent = `Guesses: ${cur.guesses}`;
}
function lockPick(ix){
  const cur = S.C.cur; if (!cur || cur.busy || cur.picked.includes(ix) || cur.picked.length >= 6) return;
  cur.picked.push(ix); $("#cFb").textContent = ""; lockUI();
  if (cur.picked.length === 6){ cur.busy = true; setTimeout(lockSubmit, 220); }
}
function lockSubmit(){
  const lock = C_LOCKS[S.C.i], cur = S.C.cur; if (!cur) return;
  const g = cur.picked.map(ix => lock.letters[ix]).join(""), fb = $("#cFb");
  cur.guesses++; cur.list.push(g);
  if (lock.solvable && g === lock.answer){
    fb.className = "fb good"; fb.textContent = "Unlocked!"; $("#cPad").innerHTML = icon("lock-open", 40); $("#cPad").classList.add("open");
    lockUI(); finishLock("solved");
  } else {
    fb.className = "fb bad"; fb.textContent = `${g} doesn't open it. Keep trying or skip.`;
    $("#cSlots")?.classList.add("shake"); setTimeout(() => $("#cSlots")?.classList.remove("shake"), 400);
    cur.picked = []; cur.busy = false; lockUI();
  }
}
AFTER.C = () => {
  if (S.C.phase !== "play") return;
  const lock = C_LOCKS[S.C.i];
  if (!S.C.cur || S.C.cur.n !== lock.n) S.C.cur = { n:lock.n, t0:now(), guesses:0, list:[], picked:[], order:[0,1,2,3,4,5], shuffles:0, busy:false };
  const cur = S.C.cur;
  lockUI();
  const tick = () => {
    const el = (now()-cur.t0)/1000, left = Math.max(0, C_LIMIT-el);
    const t = $("#cTimer"); if (t) t.textContent = `${Math.ceil(left)} s left`;
    if (left <= 0) finishLock("timeout");
  };
  clearTimer(); timerId = setInterval(tick, 250); tick();
};
document.addEventListener("keydown", e => {
  if (S.screen !== "C" || S.C.phase !== "play" || !S.C.cur || e.metaKey || e.ctrlKey || e.altKey) return;
  const lock = C_LOCKS[S.C.i], cur = S.C.cur;
  if (e.key === "Backspace"){ e.preventDefault(); if (!cur.busy){ cur.picked.pop(); lockUI(); } return; }
  if (e.key === "Escape"){ if (!cur.busy){ cur.picked = []; lockUI(); } return; }
  const k = e.key.toUpperCase();
  if (/^[A-Z]$/.test(k)){ const ix = cur.order.find(i => lock.letters[i] === k && !cur.picked.includes(i)); if (ix != null) lockPick(ix); }
});
function finishLock(outcome){
  if (!S.C.cur) return;
  clearTimer();
  const cur = S.C.cur, seconds = Math.min(C_LIMIT, (now()-cur.t0)/1000);
  S.C.results.push({ n:cur.n, seconds: Math.round(seconds*10)/10, guesses:cur.guesses, guessList:cur.list, shuffles:cur.shuffles||0, outcome, at: iso() });
  S.C.cur = null;
  const next = () => { if (S.C.i < C_LOCKS.length-1){ S.C.i++; render(); } else go("debriefC"); };
  if (outcome === "solved") setTimeout(next, 700); else next();
}

SCREENS.debriefC = () => {
  const rows = S.C.results.map(r => { const l = C_LOCKS.find(x=>x.n===r.n); return `<tr><td class="n">${r.n}</td><td class="n">${l.letters}</td><td>${l.solvable? l.answer : "<b>No answer</b>"}</td><td>${r.outcome}</td><td class="n">${r.seconds} s</td></tr>`; }).join("");
  return `
  <div class="stack-sm"><span class="eyebrow">Game C · Debrief</span><h2>Three of those locks had no answer.</h2></div>
  <p>Locks 3, 5 and 7 cannot be opened: no English word uses all six letters. We checked them against a 234,000-word dictionary. The game measures how long and how actively you kept trying on those three, which researchers use as a sign of persistence. Moving on from an impossible task can also be a smart choice, so this describes a habit, not a grade.</p>
  <div class="tablewrap"><table><thead><tr><th>Lock</th><th>Letters</th><th>Answer</th><th>Outcome</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row"><button class="btn" data-act="toSR">Go to the mirror round</button></div>`;
};

/* Mirror round: same items and 1–5 values as a questionnaire, played as a card deck and a picture board */
function face(v, size=30){
  const c = [-4.5,-2.2,0,2.2,4.5][v-1];
  const mouth = c === 0 ? `<path d="M8 15.5h8"/>` : `<path d="M7.5 ${15.5-c/2}Q12 ${15.5+c} 16.5 ${15.5-c/2}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="9.5" r="1" fill="currentColor"/><circle cx="15" cy="9.5" r="1" fill="currentColor"/>${mouth}</svg>`;
}
SCREENS.SR = () => S.SR.block === 0 ? deckScreen() : boardScreen();
function deckScreen(){
  const i = S.SR.deckI;
  const head = `<div class="stack-sm"><span class="eyebrow">Mirror round · part 1 of 2 · Is this you?</span>
    <h2>Drag each card to where it fits you.</h2>
    <p class="muted">Describe yourself as you generally are now, not as you wish to be. Tap a zone, drag the card, or press 1–5.</p></div>`;

    ${practice ? "" : progress(i, DECK.length, "Card")}
    <div class="deck-area">
      <div class="deck-stack">
        ${!practice && i < DECK.length-1 ? `<div class="deck-shadow"></div>` : ""}
        <div class="deck-card ${practice?"practice":""}" id="deckCard" tabindex="-1">
          <span class="eyebrow">${practice ? "Practice card · not scored" : "I\u2026"}</span>
          <p class="deck-text">${practice ? "Enjoy spicy food." : esc(it.text)}</p>
          ${practice ? `<p class="small muted">Read each card as if it starts with \u201cI\u201d. If you usually order the spicy option, drop it on Kind of me.</p>` : ""}

          <span class="zf">${face(v,26)}</span><b>${friendly}</b><span class="za">${anchor}</span></button>`).join("")}</div>
    </div>

}
function boardScreen(){
  const A = S.SR.answers, n = INTEREST_ITEMS.filter(i => A[i.id]).length;
  const tile = (id, ic, text, val, practice) => `
    <div class="job ${val?"rated":""} ${practice?"practice":""}" id="job-${id}">
      <div class="job-top"><span class="art">${icon(ic, 26)}</span>${practice?`<span class="eyebrow">Practice · not scored</span>`:""}</div>
      <p>${esc(text)}</p>
      <div class="faces" role="group" aria-label="How much would you enjoy: ${esc(text)}">${LIKE_SCALE.map((lab,k) => `
        <button class="facebtn ${val===k+1?"on":""}" data-act="face" data-id="${id}" data-v="${k+1}" type="button" title="${lab}" aria-label="${lab}" aria-pressed="${val===k+1}">${face(k+1,24)}</button>`).join("")}</div>

    </div>`;
  return `<div class="stack-sm"><span class="eyebrow">Mirror round · part 2 of 2 · Dream job board</span>
    <h2>How much would you enjoy doing this as part of your job?</h2>

    <div class="board">${tile("practice","utensils","Plan the menu for a large wedding", S.SR.practice2, true)}

    <div class="row"><button class="btn" data-act="srNext" id="boardNext" ${n===INTEREST_ITEMS.length?"":"disabled"}>See my results</button>

}
function deckAnswer(v){
  const i = S.SR.deckI; if (S.SR.lock) return;
  if (i === -1){ S.SR.practice = v; S.SR.deckI = 0; S.SR.flash = "Practice done. From here on, every card counts."; S.SR.t0 = 0; render(); return; }
  if (i >= DECK.length) return;
  const it = DECK[i]; S.SR.answers[it.id] = v; S.SR.times[it.id] = S.SR.t0 ? Math.round(now()-S.SR.t0) : null; S.SR.flash = "";
  const card = $("#deckCard"), zone = $(`.zone.z${v}`);
  S.SR.lock = true;
  if (card && zone){ const a = card.getBoundingClientRect(), b = zone.getBoundingClientRect();
    card.style.transition = "transform .18s ease-in, opacity .18s"; card.style.transform = `translate(${b.left+b.width/2-(a.left+a.width/2)}px, ${b.top-(a.top+a.height/2)}px) scale(.35)`; card.style.opacity = "0"; }
  setTimeout(() => { S.SR.lock = false; S.SR.deckI++; S.SR.t0 = 0; render(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 190);
}
AFTER.SR = () => {
  if (S.SR.block !== 0) return;
  if (!S.SR.t0) S.SR.t0 = now();
  const card = $("#deckCard"); if (!card) return;
  let sx=0, sy=0, drag=false, over=null;
  const zoneAt = (x,y) => [...document.querySelectorAll(".zone")].find(z => { const r = z.getBoundingClientRect(); return x>=r.left-6 && x<=r.right+6 && y>=r.top-24 && y<=r.bottom+6; });
  card.addEventListener("pointerdown", e => { drag = true; sx = e.clientX; sy = e.clientY; card.setPointerCapture(e.pointerId); card.classList.add("dragging"); });
  card.addEventListener("pointermove", e => {
    if (!drag) return; const dx = e.clientX-sx, dy = e.clientY-sy;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/18}deg)`;
    const z = zoneAt(e.clientX, e.clientY); if (z !== over){ over?.classList.remove("hot"); over = z; over?.classList.add("hot"); }
  });
  const end = e => { if (!drag) return; drag = false; card.classList.remove("dragging");
    const z = zoneAt(e.clientX, e.clientY); over?.classList.remove("hot"); over = null;
    if (z) deckAnswer(+z.dataset.v); else { card.style.transition = "transform .15s"; card.style.transform = ""; setTimeout(()=>{ card.style.transition=""; },160); } };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
};
document.addEventListener("keydown", e => {
  if (S.screen !== "SR" || S.SR.block !== 0 || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-5]$/.test(e.key)) deckAnswer(+e.key);
  else if (e.key === "Backspace" && S.SR.deckI > 0){ e.preventDefault(); S.SR.deckI--; S.SR.t0 = 0; render(); }
});

function evidenceReport(P){
  const I = P.interest;
  const sceneLine = sid => { const sc = B_SCENES.find(s=>s.id===sid), lv = S.B.levels[sid]; return `${esc(sc.title)} → “${esc(sc.options[lv-1])}” (level ${lv})`; };
  const itemLine = (it, scale) => `${esc(it.text)} → ${esc(scale[S.SR.answers[it.id]-1])} (${S.SR.answers[it.id]}${it.key===-1?", reversed":""})`;

  const interestEv = `<b>Game A</b><div class="calc">${TYPES.map(t=>`${t} ${TYPE_INFO[t].name}: ${I.game.calc[t].replace("\n","; ")}`).join("\n")}</div>
    <b>Interest questions</b><div class="calc">${TYPES.map(t=>`${t}: ${I.self.calc[t].replace("\n","; ")}`).join("\n")}</div>`;
  const blocks = [
    evBlock("interest","Work interests", I.label, `Combined code ${I.combinedCode}`, interestEv, I.rule,
      `${refLink("onet")}; ${refLink("nye")}. Activity cards and interest items written for this prototype in O*NET work-activity style; not validated. Tie-break: more “most” picks, then order R, I, A, S, E, C.`),
    ...TRAITS.map(tr => { const t = P.traits[tr];
      return evBlock(tr, `${TRAIT_INFO[tr].plain} (${TRAIT_INFO[tr].name})`, t.label, traitStatement(tr,t),
        `<b>Game B</b><ul>${t.game.scenes.map(s=>`<li>${sceneLine(s)}</li>`).join("")}</ul><div class="calc">${esc(t.game.calc)}</div>
         <b>Mini-IPIP</b><ul>${MINI_IPIP.filter(i=>i.trait===tr).map(i=>`<li>${itemLine(i, ACC_SCALE)}</li>`).join("")}</ul><div class="calc">${esc(t.self.calc)}</div>`,
        t.rule, `${refLink("miniipip")} (public-domain IPIP items). Scenes written for this prototype. ${refLink("dang")}.`); }),
    evBlock("P","Hard problems (persistence)", P.persistence.label, P.persistence.sentence,
      `<b>Game C</b><div class="calc">${esc(P.persistence.game.calc)}</div>
       <b>Persistence items</b><ul>${PERSIST_ITEMS.map(i=>`<li>${itemLine(i, ACC_SCALE)}</li>`).join("")}</ul><div class="calc">${esc(P.persistence.self.calc)}</div>
       <p class="small">Solvable locks opened: ${P.persistence.game.solved} of 5 (reported, not scored). Locks flagged “waiting, not trying”: ${P.persistence.game.flags}.</p>`,
      P.persistence.rule, `${refLink("ventura")}; ${refLink("palaoag")}. Persistence items written for this prototype; not validated.`)
  ];

  const aRows = S.A.picks.map(p => `<tr><td class="n">${p.round}</td><td>${p.cards.map(c=>`<span class="tt" style="background:${typeColor(c.type)}">${c.type}</span> ${esc(c.text)}`).join("<br>")}</td><td class="n">${p.most}</td><td class="n">${p.least}</td><td class="n">${p.ms!=null?(p.ms/1000).toFixed(1)+" s":"–"}</td><td class="n">${p.changes??0}</td></tr>`).join("");
  const bRows = S.B.log.map(l => `<tr><td class="n">${l.id}</td><td class="n">${l.trait}</td><td>${esc(B_SCENES.find(s=>s.id===l.id).options[l.level-1])}</td><td class="n">${l.level}</td><td class="n">${l.ms!=null?(l.ms/1000).toFixed(1)+" s":"–"}</td><td class="n">${l.changes}</td></tr>`).join("");
  const cRows = P.persistence.game.rows.map(r => `<tr><td class="n">${r.n}</td><td class="n">${C_LOCKS.find(l=>l.n===r.n).letters}</td><td>${r.solvable?"solvable":"unsolvable"}</td><td>${r.outcome}</td><td class="n">${r.seconds} s</td><td class="n">${r.guesses}</td><td class="n">${r.shuffles??0}</td><td class="n">${r.active!=null?r1(r.active)+" s":"–"}</td><td>${r.flag?"waiting":""}</td><td class="mono small">${esc((r.guessList||[]).join(" "))}</td></tr>`).join("");
  const srRows = [...MINI_IPIP.map(i=>[i.id,"Mini-IPIP "+i.trait+(i.key===1?"+":"−"),i.text,ACC_SCALE]),...INTEREST_ITEMS.map(i=>[i.id,"Interest "+i.type,i.text,LIKE_SCALE]),...PERSIST_ITEMS.map(i=>[i.id,"Persistence"+(i.key===1?"+":"−"),i.text,ACC_SCALE])]
    .map(([id,kind,text,sc]) => `<tr><td class="n">${id}</td><td>${kind}</td><td>${esc(text)}</td><td>${esc(sc[S.SR.answers[id]-1])}</td><td class="n">${S.SR.answers[id]}</td><td class="n">${S.SR.times[id]!=null?(S.SR.times[id]/1000).toFixed(1)+" s":"–"}</td></tr>`).join("");
  const aiRows = S.ai.log.length ? S.ai.log.map(l=>`<tr><td class="n">${esc(l.at.slice(11,19))}</td><td>${esc(l.kind)}</td><td>${esc(l.model)}</td><td style="white-space:pre-wrap">${esc(l.reply)}</td></tr>`).join("") : "";
  const dur = S.startedAt && S.finishedAt ? Math.round((new Date(S.finishedAt)-new Date(S.startedAt))/60000) + " min" : "–";

  return `
  <div class="ev">
    <div class="panel small stack-sm">
      <div class="row" style="justify-content:space-between"><b>Session</b><span class="mono">v${VERSION}</span></div>
      <div class="tablewrap"><table><tbody>
        <tr><th>Started</th><td class="n">${esc(S.startedAt||"–")}</td></tr>
        <tr><th>Finished</th><td class="n">${esc(S.finishedAt||"–")} (${dur})</td></tr>
        <tr><th>Consent</th><td>18+ confirmed: ${S.setup.adult?"yes":"no"} · agreed to take part: ${S.setup.consent?"yes":"no"}</td></tr>
        <tr><th>Stage / field</th><td>${esc(S.setup.stage)} · ${esc(S.setup.field||"not given")} (not scored)</td></tr>
        <tr><th>AI mode</th><td>${S.ai.enabled?"on":"off"} · ${S.ai.log.length} AI messages (never used in scoring)</td></tr>
        <tr><th>Data</th><td>${S.example?"<b>Example data, not a real person</b>":"Real session"}</td></tr>
      </tbody></table></div>
    </div>
    <h3>Each result, traced</h3>
    ${blocks.join("")}
    <h3>Raw data</h3>
    <details><summary>Game A · 12 rounds</summary><div class="tablewrap"><table><thead><tr><th>#</th><th>Cards (type hidden during play)</th><th>Most</th><th>Least</th><th>Time</th><th>Changes</th></tr></thead><tbody>${aRows}</tbody></table></div></details>
    <details><summary>Game B · 10 scenes</summary><div class="tablewrap"><table><thead><tr><th>Scene</th><th>Trait</th><th>Chosen option</th><th>Level</th><th>Time</th><th>Changes</th></tr></thead><tbody>${bRows}</tbody></table></div></details>
    <details><summary>Game C · 8 locks</summary><div class="tablewrap"><table><thead><tr><th>Lock</th><th>Letters</th><th>Type</th><th>Outcome</th><th>Time</th><th>Guesses</th><th>Shuffles</th><th>Active</th><th>Flag</th><th>Guesses made</th></tr></thead><tbody>${cRows}</tbody></table></div></details>
    <details><summary>Mirror round · 34 answers</summary><div class="tablewrap"><table><thead><tr><th>Id</th><th>Scale</th><th>Item</th><th>Answer</th><th>Value</th><th>Time</th></tr></thead><tbody>${srRows}</tbody></table></div></details>
    ${aiRows ? `<details><summary>AI messages (not scored)</summary><p class="small">System prompt:</p><div class="calc">${esc(AI_SYSTEM)}</div><div class="tablewrap"><table><thead><tr><th>Time</th><th>Kind</th><th>Model</th><th>Reply</th></tr></thead><tbody>${aiRows}</tbody></table></div></details>` : ""}
    <details open><summary>Export</summary>
      <div class="stack-sm">
        <p class="small">The full session as JSON, including every rule result, or the evidence report as a standalone page.</p>
        <div class="row"><button class="btn small" data-act="copyJson">Copy JSON</button><button class="btn small ghost" data-act="dlJson">Download JSON</button><button class="btn small ghost" data-act="dlHtml">Download evidence report</button><span class="small" id="copyMsg" role="status"></span></div>
        <div class="jsonbox" id="jsonBox">${esc(JSON.stringify(exportData(), null, 2))}</div>
      </div></details>
  </div>`;
}
function exportData(){
  return { app:"Inferred Ikigai prototype", version:VERSION, example:S.example, startedAt:S.startedAt, finishedAt:S.finishedAt,
    setup:{...S.setup}, gameA:S.A.picks, gameB:S.B.log, gameC:S.C.results, selfReport:S.SR.answers,
    profile:S.profile, reactions:S.reactions, notes:S.notes, ai:{enabled:S.ai.enabled, model:S.ai.model, systemPrompt:AI_SYSTEM, log:S.ai.log} };
}

/* ---------- AI mode ---------- */
const AI_SYSTEM = `You are a reflection coach for a university student exploring careers. You receive their profile from a prototype that scored it with fixed rules. Rules: Never change, dispute or add scores or labels. Never tell them which career to choose. Ask at most three short, open questions that help them test the results against their real experience. When asked for an experiment, suggest one small, concrete, low-cost action they can do within two weeks. Treat "conflicting" results as open questions. Use plain English, under 150 words.`;
function profileSummary(){
  const P = S.profile;
  return JSON.stringify({ interestCode:P.interest.combinedCode, interestAgreement:P.interest.label,
    traits:Object.fromEntries(TRAITS.map(t=>[TRAIT_INFO[t].plain,{score:P.traits[t].avg,agreement:P.traits[t].label,statement:traitStatement(t,P.traits[t])}])),
    persistence:{score:P.persistence.avg,agreement:P.persistence.label}, studentReactions:S.reactions, studentNotes:S.notes, stage:S.setup.stage });
}
function coachPanel(){
  if (!S.ai.enabled) return `<div class="note small">Turn on <b>AI mode</b> (top right) to add a reflection coach. It asks questions about these results and never changes a score.</div>`;
  const msgs = S.ai.log.filter(l=>l.kind!=="error").map(l => `${l.user?`<div class="msg me"><span class="who">You</span>${esc(l.user)}</div>`:""}<div class="msg ai"><span class="who">AI-generated · ${esc(l.model)}</span>${esc(l.reply)}</div>`).join("");
  return `<div class="coach"><div class="row" style="justify-content:space-between"><h3>Reflection coach</h3><span class="pill example">AI-generated, not scored</span></div>
    ${msgs || `<p class="small muted">The coach sees your scores, labels and reactions, not your nickname.</p>`}
    ${S.ai.error ? `<p class="small" style="color:var(--conflict)">${esc(S.ai.error)}</p>`:""}
    <div class="row"><button class="btn small" data-act="aiAsk" data-kind="questions" ${S.ai.busy?"disabled":""}>Ask me questions</button><button class="btn small ghost" data-act="aiAsk" data-kind="experiment" ${S.ai.busy?"disabled":""}>Suggest one small experiment</button></div>
    <form id="aiForm" class="guessrow" style="max-width:none"><input type="text" id="aiInput" placeholder="Reply or ask something about your results" aria-label="Message to the coach"><button class="btn small" type="submit" ${S.ai.busy?"disabled":""}>Send</button></form>
    ${S.ai.busy?`<p class="small muted">Thinking…</p>`:""}</div>`;
}
async function aiCall(kind, userText){
  const prompts = { questions:"Ask me up to three reflection questions about my profile.", experiment:"Suggest one small experiment I can try in the next two weeks to test my top interest.", chat:userText };
  const history = S.ai.log.filter(l=>l.kind!=="error").flatMap(l => [{role:"user",content:l.prompt},{role:"assistant",content:l.reply}]).slice(-8);
  const messages = [{role:"system",content:AI_SYSTEM},{role:"user",content:"My profile: "+profileSummary()},...history,{role:"user",content:prompts[kind]}];
  S.ai.busy = true; S.ai.error = ""; render();
  try{
    let res;
    if (S.ai.server) res = await fetch("api/ai", { method:"POST", headers:{"Content-Type":"application/json", ...(S.ai.key?{"x-user-key":S.ai.key}:{})}, body: JSON.stringify({ model:S.ai.model, messages }) });
    else {
      if (!S.ai.key) throw new Error("Add an API key in AI mode settings first.");
      res = await fetch(S.ai.baseUrl.replace(/\/$/,"") + "/chat/completions", { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.ai.key}, body: JSON.stringify({ model:S.ai.model, messages, temperature:0.7, max_tokens:400 }) });
    }
    if (!res.ok){ const t = await res.text(); throw new Error(`The AI provider returned ${res.status}. ${t.slice(0,160)}`); }
    const j = await res.json();
    const reply = j.choices?.[0]?.message?.content?.trim() || "(empty reply)";
    S.ai.log.push({ at:iso(), kind, model:S.ai.model, prompt:prompts[kind], user: kind==="chat"?userText:"", reply });
  } catch(e){
    S.ai.error = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
      ? "Couldn't reach the AI provider from this page. This preview blocks outside connections; the Vercel version sends AI calls through its own server."
      : e.message;
  } finally { S.ai.busy = false; render(); }
}

function makeExample(){
  const s = freshState(); s.example = true; s.screen = "results";
  s.setup = { adult:true, consent:true, stage:"Final year of a bachelor's degree", field:"Computer Science", nickname:"Example student" };
  s.startedAt = "2026-10-13T10:00:00.000Z"; s.finishedAt = "2026-10-13T10:27:00.000Z";
  const pref = ["I","A","S","C","E","R"]; // made-up preference order
  s.A.picks = A_ROUNDS.map(rd => { const ts = rd.cards.map(c=>c.type).sort((a,b)=>pref.indexOf(a)-pref.indexOf(b));
    return { round:rd.round, cards:rd.cards, most:ts[0], least:ts[2], ms:4200+rd.round*130, changes: rd.round===5?1:0 }; });
  const lv = {E1:2,E2:2,A1:3,A2:4,C1:4,C2:3,N1:2,N2:3,O1:4,O2:3};
  s.B.levels = lv; s.B.log = B_SCENES.map((sc,i)=>({ id:sc.id, trait:sc.trait, level:lv[sc.id], ms:6000+i*300, changes:i===3?1:0 }));
  s.C.results = [
    {n:1,seconds:22.4,guesses:3,guessList:["MAKTER","MARTEK","MARKET"],outcome:"solved"},
    {n:2,seconds:31.0,guesses:2,guessList:["BIRDGE","BRIDGE"],outcome:"solved"},
    {n:3,seconds:64.2,guesses:5,guessList:["BISKET","BESKIT","KISBET","TIKBES","BETSKI"],outcome:"skipped"},
    {n:4,seconds:18.7,guesses:1,guessList:["POCKET"],outcome:"solved"},
    {n:5,seconds:90.0,guesses:2,guessList:["PREWIN","WINPER"],outcome:"timeout"},
    {n:6,seconds:40.3,guesses:2,guessList:["JUNGEL","JUNGLE"],outcome:"solved"},
    {n:7,seconds:12.5,guesses:1,guessList:["MORTIL"],outcome:"skipped"},
    {n:8,seconds:90.0,guesses:4,guessList:["WOWDIN","DOWWIN","WINDWO","WIDNOW"],outcome:"timeout"}];
  const a = {}; // Mini-IPIP made-up answers
  Object.assign(a,{M1:2,M6:4,M11:2,M16:4, M2:4,M7:2,M12:4,M17:1, M3:4,M8:2,M13:5,M18:2, M4:2,M9:4,M14:2,M19:4, M5:5,M10:1,M15:2,M20:1});
  Object.assign(a,{I1:2,I7:2,I2:5,I8:4,I3:4,I9:3,I4:4,I10:3,I5:2,I11:1,I6:3,I12:3, P1:4,P2:2});
  s.SR.answers = a;
  s.profile = buildProfile({ A:{picks:s.A.picks}, B:{levels:s.B.levels}, C:{results:s.C.results}, SR:{answers:a} });
  s.ai = { ...S.ai, log:[], busy:false, error:"" };
  return s;
}

let dlNs; // claude.ai downloads capability, or null outside the viewer
async function download(name, text, type){
  const m = $("#copyMsg");
  if (dlNs === undefined) dlNs = window.claude?.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dlNs){
    try { await dlNs.save({ filename:name, data:text }); if (m) m.textContent = "Saved."; }
    catch(e){ if (m) m.textContent = e?.code === "declined" ? "Download cancelled." : "Couldn't save the file here. Use Copy JSON instead."; }
    return;
  }
  try { const b = new Blob([text],{type}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); if (m) m.textContent = "Downloaded."; }
  catch(e){ if (m) m.textContent = "Couldn't start the download. Use Copy JSON instead."; }
}
function evidenceHtmlFile(){
  const css = document.querySelector("style").outerHTML;
  const saved = S.tab; S.tab = "evidence"; const body = evidenceReport(S.profile); S.tab = saved;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Evidence report · Inferred Ikigai ${VERSION}</title>${css}</head><body><div class="wrap"><main><section class="screen"><h1>Evidence report</h1>${body.replace(/<details(?! open)/g,"<details open")}</section></main></div></body></html>`;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "srPick" || act === "note") return;
  switch(act){
    case "home": go("welcome"); break;
    case "start": { const ai = currentAi(); S = freshState(); S.ai = {...S.ai, ...ai}; go("setup"); break; }
    case "example": { const ai = currentAi(); S = makeExample(); S.ai = {...S.ai, ...ai}; render(); window.scrollTo({top:0}); break; }
    case "restart": { const ai = currentAi(); S = freshState(); S.ai = {...S.ai, ...ai}; go("welcome"); break; }
    case "setupNext":
      S.setup = { adult:$("#adult").checked, consent:$("#consent").checked, stage:$("#stage").value, field:$("#field").value.trim(), nickname:$("#nickname").value.trim() };
      S.startedAt = iso(); go("A"); break;
    case "aPick": {
      const kind = el.dataset.kind, t = el.dataset.t, sel = S.A.sel, other = kind==="most"?"least":"most";
      if (sel[kind] && sel[kind] !== t) sel.changes++;
      sel[kind] = sel[kind]===t ? null : t; if (sel[other]===t) sel[other]=null; render(); break; }
    case "aNext": {
      const rd = A_ROUNDS[S.A.i];
      S.A.picks.push({ round:rd.round, cards:rd.cards, most:S.A.sel.most, least:S.A.sel.least, ms: Math.round(now()-S.A.t0), changes:S.A.sel.changes, at:iso() });
      S.A.sel = {most:null,least:null,changes:0}; S.A.t0 = 0;
      if (S.A.i < A_ROUNDS.length-1){ S.A.i++; render(); } else go("B");
      break; }
    case "bPick": { const o = +el.dataset.o; if (S.B.sel!==null && S.B.sel!==o) S.B.changes++; S.B.sel = o; render(); break; }
    case "bNext": {
      const sc = B_SCENES[S.B.i], level = S.B.sel+1;
      S.B.levels[sc.id] = level; S.B.log.push({ id:sc.id, trait:sc.trait, level, ms:Math.round(now()-S.B.t0), changes:S.B.changes, at:iso() });
      S.B.sel = null; S.B.changes = 0; S.B.t0 = 0;
      if (S.B.i < B_SCENES.length-1){ S.B.i++; render(); } else { S.C.phase = "intro"; go("C"); }
      break; }
    case "cBegin": S.C.phase = "play"; render(); break;
    case "cSkip": finishLock("skipped"); break;
    case "cTile": lockPick(+el.dataset.ix); break;
    case "cDel": if (S.C.cur && !S.C.cur.busy){ S.C.cur.picked.pop(); lockUI(); } break;
    case "cClear": if (S.C.cur && !S.C.cur.busy){ S.C.cur.picked = []; lockUI(); } break;
    case "cShuffle": if (S.C.cur && !S.C.cur.busy){ const o = S.C.cur.order; S.C.cur.order = [3,0,5,1,4,2].map(k => o[k]); S.C.cur.shuffles++; lockUI(); } break;
    case "zone": deckAnswer(+el.dataset.v); break;
    case "deckUndo": if (S.SR.deckI > 0){ S.SR.deckI--; S.SR.t0 = 0; render(); } break;
    case "face": {
      const id = el.dataset.id, v = +el.dataset.v;
      if (id === "practice") S.SR.practice2 = v; else S.SR.answers[id] = v;
      const job = document.getElementById("job-"+id); job.classList.add("rated");
      job.querySelectorAll(".facebtn").forEach(b => { const on = b===el; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      job.querySelector(".facelab").textContent = LIKE_SCALE[v-1];
      const n = INTEREST_ITEMS.filter(i => S.SR.answers[i.id]).length;
      $("#boardCount").textContent = `${n} of ${INTEREST_ITEMS.length} rated`; $("#boardNext").disabled = n < INTEREST_ITEMS.length;
      break; }
    case "toSR": go("SR"); break;
    case "srNext":
      if (S.SR.block < 1){ S.SR.block++; go("SR"); }
      else {
        S.finishedAt = iso();
        S.profile = buildProfile({ A:{picks:S.A.picks}, B:{levels:S.B.levels}, C:{results:S.C.results}, SR:{answers:S.SR.answers} });
        S.tab = "student"; go("results");
      }
      break;
    case "tab": S.tab = el.dataset.v; S.openEv = null; render(); window.scrollTo({top:0}); break;
    case "react": S.reactions[el.dataset.id] = el.dataset.v;
      el.parentElement.querySelectorAll("button").forEach(b => { const on = b===el; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); break;
    case "toEvidence": e.preventDefault(); S.tab = "evidence"; S.openEv = el.dataset.id; render();
      setTimeout(()=>document.getElementById("ev-"+el.dataset.id)?.scrollIntoView({block:"start"}), 30); break;
    case "copyJson": {
      const txt = JSON.stringify(exportData(), null, 2), m = $("#copyMsg");
      (navigator.clipboard?.writeText(txt) || Promise.reject()).then(()=>{ m.textContent = "Copied."; })
        .catch(()=>{ const r = document.createRange(); r.selectNodeContents($("#jsonBox")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); m.textContent = "Selected. Press Ctrl+C or Cmd+C to copy."; });
      break; }
    case "dlJson": download(`inferred-ikigai-${(S.finishedAt||iso()).slice(0,10)}.json`, JSON.stringify(exportData(), null, 2), "application/json"); break;
    case "dlHtml": download(`evidence-report-${(S.finishedAt||iso()).slice(0,10)}.html`, evidenceHtmlFile(), "text/html"); break;
    case "aiAsk": aiCall(el.dataset.kind); break;
    case "closeModal": $("#modalRoot").innerHTML = ""; $("#aiBtn").focus(); break;
    case "closeModalBg": if (e.target === el){ $("#modalRoot").innerHTML = ""; } break;
    case "saveAi":
      S.ai.enabled = $("#aiOn").checked; S.ai.key = $("#aiKey").value.trim(); S.ai.model = $("#aiModel").value.trim() || "gpt-4o-mini";
      if ($("#aiBase")) S.ai.baseUrl = $("#aiBase").value.trim() || "https://api.openai.com/v1";
      S.ai.error = ""; $("#modalRoot").innerHTML = ""; render(); break;
  }
});
function currentAi(){ return { enabled:S.ai.enabled, key:S.ai.key, model:S.ai.model, baseUrl:S.ai.baseUrl, server:S.ai.server, serverKey:S.ai.serverKey }; }
document.addEventListener("input", e => { const el = e.target; if (el.dataset?.act === "note") S.notes[el.dataset.id] = el.value; });
document.addEventListener("submit", e => {
  if (e.target.id === "aiForm"){ e.preventDefault(); const v = $("#aiInput").value.trim(); if (v) aiCall("chat", v); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalRoot").innerHTML){ $("#modalRoot").innerHTML = ""; } });
$("#aiBtn").addEventListener("click", openAiSettings);

// Detect the Vercel server route for AI calls (absent in the preview).
(async () => {
  try { const r = await fetch("api/health", {cache:"no-store"}); if (r.ok){ const j = await r.json(); if (j && j.ok){ S.ai.server = true; S.ai.serverKey = !!j.serverKey; } } } catch(e){}
})();

render();
</script>

</body>
